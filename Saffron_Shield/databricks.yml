# This is a Declarative Automation Bundle definition for Saffron_Shield.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Saffron_Shield
  uuid: 9c8759a4-6acd-4d3c-8a62-f42f67192aac

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e63a3b85-204d.cloud.databricks.com
    variables:
      catalog: claims
  prod:
    mode: production
    workspace:
      host: https://dbc-e63a3b85-204d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jainanvesha14@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jainanvesha14@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
    permissions:
      - user_name: jainanvesha14@gmail.com
        level: CAN_MANAGE
